<title>Programación de Catequesis 2026 | Colegio La Salle del Sur</title>

:root {
  --navy: #081c3b;

  --paper: #ffffff;

  --muted: #65758b;
  --line: #e6dcce;

* { box-sizing: border-box; }

}

}
header {

  justify-content: space-between;
  align-items: center;

  gap: 20px;
}

  padding: 10px 20px;

  font-family: Fredoka, sans-serif;

.btn-actualizar {
  background: linear-gradient(135deg, #34d399, #059669);

.btn-home:hover, .btn-actualizar:hover {

}

}

  background: #fcf9f2;
  border: 1px solid #efe4d0;
  border-radius: 12px;
  padding: 12px 14px;
}
.topic-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 4px;
}
.topic-number {

  font-weight: 900;
  color: #9a711d;
  background: #fff2cf;
  padding: 2px 8px;
  border-radius: 6px;
}
.topic-id {
  font-size: 10px;
  font-weight: 700;
  color: var(--muted);
