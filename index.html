
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camino hacia Jesús 2026</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#071d49}
body{min-height:100vh;min-height:100dvh;overflow:hidden}

/* FONDO: PORTADA ORIGINAL */
.fondo{
position:fixed;
inset:0;
z-index:0;
background:#071d49 url("./assets/PORTAL_CATEQUESIS.png") center center/contain no-repeat;
}

/* BOTONES A LA IZQUIERDA, SIN TITULO NI PANEL */
.botones{
position:fixed;
z-index:2;
left:12px;
top:50%;
transform:translateY(-50%);
width:clamp(76px,9vw,125px);
display:flex;
flex-direction:column;
gap:8px;
}

.boton{
display:block;
width:100%;
padding:0;
margin:0;
border:2px solid #e8b947;
border-radius:9px;
overflow:hidden;
background:#071d49;
box-shadow:0 2px 8px #0008;
transition:transform .2s;
}

.boton img{
display:block;
width:100%;
height:auto;
}

.boton:hover{transform:scale(1.03)}
.boton:focus-visible{outline:3px solid white;outline-offset:2px}

@media(max-width:600px){
.fondo{
background-size:auto 100%;
background-position:center center;
}
.botones{
left:5px;
width:clamp(62px,19vw,85px);
gap:6px;
}
.boton{border-width:1px;border-radius:6px}
}

@media(max-height:600px) and (min-width:601px){
.botones{width:75px;gap:4px}
}
</style>
</head>
<body>

<div class="fondo" aria-hidden="true"></div>

<nav class="botones" aria-label="Portales de catequesis">
<a class="boton" href="./catequizandos.html">
<img src="./assets/BTN-CATEQUIS.png" alt="Catequizandos">
</a>

<a class="boton" href="./misses.html">
<img src="./assets/BTN_CATEQUISTAS.png" alt="Catequistas">
</a>

<a class="boton" href="./supervisores.html">
<img src="./assets/BTN_COORDINADOR.png" alt="Coordinador Parroquial">
</a>

<a class="boton" href="./padres.html">
<img src="./assets/BTN-PADRES.png" alt="Padres">
</a>

<a class="boton" href="./programacion.html">
<img src="./assets/BTN-PROGRAMACION.png" alt="Nuestra Programación">
</a>
</nav>

</body>
</html>
