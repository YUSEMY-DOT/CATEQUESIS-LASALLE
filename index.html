<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Camino hacia Jesús 2026 | Colegio La Salle del Sur</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --azul: #071d49;
      --dorado: #e8b947;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      font-family: Georgia, "Times New Roman", serif;
      background-color: var(--azul);
    }

    /* FONDO PRINCIPAL */
    .fondo {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-color: var(--azul);
      background-image: url("https://yusemy-dot.github.io/CATEQUESIS-LASALLE/assets/PORTAL%20CATEQUESIS.png");
      background-position: center center;
      background-repeat: no-repeat;
      background-size: cover;
      pointer-events: none;
    }

    /* BOTONES EN EL LADO IZQUIERDO */
    .botones {
      position: fixed;
      z-index: 2;
      top: 50%;
      left: clamp(8px, 1.5vw, 24px);
      transform: translateY(-50%);

      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(8px, 1.2vh, 14px);

      width: clamp(105px, 12vw, 175px);
      max-height: 94vh;
      max-height: 94dvh;
      overflow-y: auto;
      scrollbar-width: none;
    }

    .botones::-webkit-scrollbar {
      display: none;
    }

    .boton {
      display: block;
      flex: 0 0 auto;
      width: 100%;
      overflow: hidden;

      border: 2px solid var(--dorado);
      border-radius: 12px;
      background: var(--azul);
      box-shadow: 0 3px 12px #0008;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;

      -webkit-tap-highlight-color: transparent;
    }

    .boton img {
      display: block;
      width: 100%;
      height: auto;
    }

    .boton:hover {
      transform: scale(1.035);
      box-shadow: 0 0 16px #ffe08a;
    }

    .boton:active {
      transform: scale(0.98);
    }

    .boton:focus-visible {
      outline: 3px solid white;
      outline-offset: 3px;
    }

    /* TABLETAS Y CELULARES */
    @media (max-width: 700px) {
      .fondo {
        background-position: center center;
        background-size: cover;
      }

      .botones {
        left: 7px;
        width: clamp(82px, 25vw, 125px);
        gap: 9px;
      }

      .boton {
        border-width: 1.5px;
        border-radius: 9px;
      }
    }

    /* PANTALLAS BAJAS */
    @media (max-height: 500px) and (min-width: 701px) {
      .botones {
        width: 100px;
        gap: 5px;
      }

      .boton {
        width: 85px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .boton {
        transition: none;
      }
    }
  </style>
</head>
