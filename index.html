<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#02091f">
  <title>Camino hacia Jesús - Colegio La Salle del Sur</title>
  <link rel="preload" as="image" href="./assets/PORTAL%20CATEQUESIS.png">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      position: relative;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #02091f;
      display: flex;
    }

    /* PORTADA PRINCIPAL */
    .portada {
      position: relative;
      flex-grow: 1;
      height: 100%;
      overflow: hidden;
      background-color: #02091f;
      background-image: url("./assets/PORTAL%20CATEQUESIS.png");
      background-position: center center;
      background-repeat: no-repeat;
      background-size: cover;
    }

    /* PANEL LATERAL DERECHO LIMPIO Y ELEGANTE */
    .panel-menu {
      position: relative;
      z-index: 5;
      width: 160px;
      min-width: 140px;
      height: 100%;
      background: linear-gradient(135deg, #061a38 0%, #020d22 100%);
      border-left: 2px solid rgba(215, 182, 93, 0.4);
      box-shadow: -5px 0 20px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      align-items: center;
      padding: 10px 8px;
    }

    .menu {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      align-items: center;
      gap: 5px;
      margin: 0;
      padding: 0;
    }

    .menu-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      flex: 1;
      justify-content: center;
    }

    /* BOTONES LIMPIOS Y ELEGANTE */
    .boton {
      width: 85%;
      max-width: 110px;
      height: 70%;
      max-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      padding: 0;
      border: none;
      background: transparent;
      cursor: pointer;
      line-height: 0;
      overflow: visible;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.25s ease, filter 0.25s ease;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.6));
    }

    .boton img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      border: none;
      margin: 0;
      padding: 0;
      transition: transform 0.25s ease;
    }

    .boton:hover {
      transform: scale(1.08);
      filter: drop-shadow(0 0 12px rgba(245, 212, 119, 0.8)) brightness(1.15);
    }

    .boton:active {
      transform: scale(0.95);
    }

    /* EFECTO VISIBLE AL HACER CLIC */
    .boton.clicado {
      transform: scale(1.2);
      z-index: 99;
      filter: drop-shadow(0 0 20px #f5d477) brightness(1.25);
    }

    /* NOMBRE DE CADA BOTÓN DEBAJO */
    .nombre-opcion {
      margin-top: 3px;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(8px, 0.85vw, 11px);
      font-weight: 800;
      text-align: center;
      line-height: 1.1;
      text-shadow: 0 1px 2px #000, 0 0 5px rgba(255, 255, 255, 0.5);
      width: 100%;
      padding: 0 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* BOTÓN DE AUDIO */
    .control-audio {
      position: absolute;
      z-index: 10;
      top: 14px;
      left: 14px;
      width: 42px;
      height: 42px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      background: rgba(10, 35, 83, 0.8);
      border: 2px solid #ffffff;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .control-audio:hover {
      transform: scale(1.1);
      background: rgba(20, 55, 120, 0.95);
    }

    /* DERECHOS RESERVADOS */
    .derechos-reservados {
      position: fixed;
      z-index: 8;
      left: 5%;
      width: calc(100% - 160px);
      bottom: 1.2%;
      margin: 0;
      padding: 0;
      color: #ffffff;
      background: transparent;
      border: none;
      font-size: clamp(11px, 1vw, 15px);
      font-weight: 800;
      line-height: 1.3;
      text-align: center;
      text-shadow:
        -1px -1px 2px #002d83,
         1px -1px 2px #002d83,
        -1px  1px 2px #002d83,
         1px  1px 2px #002d83,
         0 0 5px #002d83;
      pointer-events: none;
    }

    @media (max-width: 600px) {
      .panel-menu { width: 110px; min-width: 95px; padding: 5px 2px; }
      .derechos-reservados { width: calc(100% - 110px); font-size: 8px; left: 0; }
      .nombre-opcion { font-size: 7px; }
    }
  </style>
</head>

<body>

  <!-- PORTADA PRINCIPAL -->
  <main class="portada" aria-label="Camino hacia Jesús">

    <!-- MÚSICA -->
    <audio id="musica" loop preload="auto">
      <source
        src="./alma-misionera-athenas-musica-catolica.mp3"
        type="audio/mpeg">
    </audio>

    <!-- ÚNICO CONTROL DE AUDIO -->
    <button
      id="controlAudio"
      class="control-audio"
      type="button"
      aria-label="Reproducir música"
      title="Activar o silenciar música">🔊</button>

  </main>

  <!-- PANEL LATERAL DERECHO DE BOTONES -->
  <aside class="panel-menu" aria-label="Menú principal">
    <nav class="menu">

      <!-- 1. NUESTRA PROGRAMACIÓN -->
      <div class="menu-item">
        <button class="boton" type="button"
          data-destino="programacion.html"
          aria-label="Nuestra Programación">
          <img src="./assets/BTN-PROGRAMACION.png" alt="Nuestra Programación">
        </button>
        <span class="nombre-opcion">Programación</span>
      </div>

      <!-- 2. CATEQUIZANDOS -->
      <div class="menu-item">
        <button class="boton" type="button"
          data-destino="catequizandos.html"
          aria-label="Catequizandos">
          <img src="./assets/BTN-CATEQUIS.png" alt="Catequizandos">
        </button>
        <span class="nombre-opcion">Catequizandos</span>
      </div>

      <!-- 3. CATEQUISTAS -->
      <div class="menu-item">
        <button class="boton" type="button"
          data-destino="CATEQUISTA.html"
          aria-label="Catequistas">
          <img src="./assets/BTN_CATEQUISTAS.png" alt="Catequistas">
        </button>
        <span class="nombre-opcion">Catequistas</span>
      </div>

      <!-- 4. PADRES DE FAMILIA -->
      <div class="menu-item">
        <button class="boton" type="button"
          data-destino="padres.html"
          aria-label="Padres de familia">
          <img src="./assets/BTN-PADRES.png" alt="Padres de familia">
        </button>
        <span class="nombre-opcion">Padres</span>
      </div>

 <!-- 5. GESTORPASTORAL -->
<div class="menu-item">
  <button class="boton" type="button"
    data-destino="GestorPastoral.html"
    aria-label="GestorPastoral">
    <img src="./assets/BTN_COORDINADOR.png" alt="GestorPastoral">
  </button>
  <span class="nombre-opcion">GestorPastoral</span>
</div>

  <!-- DERECHOS RESERVADOS -->
  <footer class="derechos-reservados">
    © Corporación La Salle del Sur. Derechos reservados.
  </footer>

  <script>
    (() => {
      "use strict";

      const musica = document.getElementById("musica");
      const controlAudio = document.getElementById("controlAudio");
      const botones = document.querySelectorAll(".boton");

      let silenciado = false;
      let contextoAudio = null;

      /* INICIAR AUDIO Y DESBLOQUEAR NAVEGADOR */
      async function iniciarMusica() {
        if (silenciado) return;

        try {
          musica.muted = false;
          musica.volume = 0.2;
          await musica.play();
          controlAudio.textContent = "🔊";
        } catch (error) {
          controlAudio.textContent = "▶";
        }
      }

      /* EFECTO SONORO DE CLIC GARANTIZADO */
      function reproducirSonidoClic() {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;

          if (!contextoAudio) {
            contextoAudio = new AudioContext();
          }

          if (contextoAudio.state === "suspended") {
            contextoAudio.resume();
          }

          const ahora = contextoAudio.currentTime;
          const osc = contextoAudio.createOscillator();
          const gain = contextoAudio.createGain();

          osc.type = "triangle";
          osc.frequency.setValueAtTime(440, ahora);
          osc.frequency.exponentialRampToValueAtTime(880, ahora + 0.12);

          gain.gain.setValueAtTime(0.001, ahora);
          gain.gain.linearRampToValueAtTime(0.15, ahora + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, ahora + 0.2);

          osc.connect(gain);
          gain.connect(contextoAudio.destination);

          osc.start(ahora);
          osc.stop(ahora + 0.22);
        } catch (e) {
          // Ignorar si el navegador bloquea
        }
      }

      /* NAVEGACIÓN CON EFECTO VISIBLE Y TIEMPO PARA APRECIAR EL AUDIO */
      botones.forEach((boton) => {
        boton.addEventListener("click", (e) => {
          e.preventDefault();
          reproducirSonidoClic();
          
          boton.classList.add("clicado");

          const destino = boton.getAttribute("data-destino");

          setTimeout(() => {
            if (destino) {
              window.location.href = destino;
            }
          }, 350); // Tiempo suficiente para escuchar el sonido y ver el zoom brillante
        });
      });

      /* CONTROL DE AUDIO MANUAL */
      controlAudio.addEventListener("click", async () => {
        reproducirSonidoClic();
        if (!silenciado) {
          silenciado = true;
          musica.muted = true;
          controlAudio.textContent = "🔇";
        } else {
          silenciado = false;
          musica.muted = false;
          await iniciarMusica();
        }
      });

      /* ACTIVAR MÚSICA AL CARGAR O PRIMER CLIC EN LA PÁGINA */
      window.addEventListener("load", () => {
        iniciarMusica();
      }, { once: true });

      document.body.addEventListener("click", () => {
        if (musica.paused && !silenciado) {
          iniciarMusica();
        }
      }, { once: true });

    })();
  </script>

</body>
</html>
