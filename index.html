
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071d49">
  <title>Camino hacia Jesús | La Salle del Sur</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #071d49;
      color: white;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    .pagina {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      grid-template-columns: clamp(90px, 12vw, 155px) minmax(0, 1fr);
      gap: clamp(10px, 1.5vw, 22px);
      padding: clamp(8px, 1.2vw, 16px);
      align-items: center;
    }

    /* MENÚ SEPARADO DE LA PORTADA */
    .menu {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(7px, 1.2vh, 13px);
      padding: 10px 6px;
      border: 1px solid rgba(226, 187, 91, 0.7);
      border-radius: 18px;
      background: linear-gradient(
        145deg,
        rgba(13, 40, 84, 0.94),
        rgba(3, 15, 43, 0.96)
      );
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.35);
    }

    .boton {
      display: block;
      width: 100%;
      max-width: 135px;
      aspect-ratio: 1 / 1;
      flex: 0 0 auto;
      padding: 2px;
      overflow: hidden;
      border: 2px solid #d9b45c;
      border-radius: 12px;
      background: #071d49;
      box-shadow: 0 2px 7px rgba(0, 0, 0, 0.35);
      transition: transform 180ms ease, box-shadow 180ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    .boton img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 8px;
    }

    .boton:hover {
      transform: translateY(-2px) scale(1.025);
      box-shadow: 0 0 13px rgba(255, 210, 105, 0.65);
    }

    .boton:active {
      transform: scale(0.94);
      box-shadow: 0 0 22px #ffd56a;
    }

    .boton:focus-visible {
      outline: 3px solid white;
      outline-offset: 3px;
    }

    /* PORTADA: IMAGEN COMPLETA, SIN DEFORMAR */
    .zona-portada {
      min-width: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .portada {
      display: block;
      width: 100%;
      height: auto;
      max-height: calc(100dvh - 24px);
      object-fit: contain;
      border-radius: 5px;
      box-shadow: 0 5px 22px rgba(0, 0, 0, 0.28);
    }

    /* BOTÓN ÚNICO DE SONIDO */
    .mute {
      position: fixed;
      z-index: 10;
      top: 12px;
      right: 12px;
      min-width: 76px;
      padding: 9px 13px;
      border: 1px solid #e5c46f;
      border-radius: 22px;
      color: #fff4d0;
      background: rgba(5, 24, 59, 0.88);
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 2px 10px #0005;
    }

    .mute:hover {
      background: #163b70;
    }

    /* PANTALLAS BAJAS */
    @media (max-height: 650px) and (min-width: 601px) {
      .pagina {
        grid-template-columns: 100px minmax(0, 1fr);
        gap: 10px;
        padding: 6px;
      }

      .menu {
        gap: 5px;
        padding: 5px 4px;
      }

      .boton {
        width: min(88px, calc((100dvh - 45px) / 5.8));
        border-radius: 7px;
      }
    }

    /* CELULARES */
    @media (max-width: 600px) {
      .pagina {
        grid-template-columns: 76px minmax(0, 1fr);
        gap: 7px;
        padding: 6px;
      }

      .menu {
        gap: clamp(5px, 1vh, 9px);
        padding: 7px 4px;
        border-radius: 12px;
      }

      .boton {
        width: 100%;
        padding: 1px;
        border-width: 1px;
        border-radius: 7px;
      }

      .boton img {
        border-radius: 5px;
      }

      .portada {
        max-height: calc(100dvh - 12px);
      }

      .mute {
        top: 6px;
        right: 6px;
        min-width: 60px;
        padding: 7px 9px;
        font-size: 10px;
      }
    }

    @media (max-width: 360px) {
      .pagina {
        grid-template-columns: 65px minmax(0, 1fr);
        gap: 5px;
        padding: 4px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .boton {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <button
    id="mute"
    class="mute"
    type="button"
    aria-label="Silenciar música"
    aria-pressed="false">
    ♪ MUTE
  </button>

  <audio id="musica" autoplay loop preload="auto">
    <source
      src="./assets/Alma%20Misionera%20Athenas%20-%20M%C3%BAsica%20Cat%C3%B3lica.mp3"
      type="audio/mpeg">
    <source
      src="./Alma%20Misionera%20Athenas%20-%20M%C3%BAsica%20Cat%C3%B3lica.mp3"
      type="audio/mpeg">
  </audio>

  <main class="pagina">

    <nav class="menu" aria-label="Secciones de catequesis">

      <a class="boton" href="./catequizandos.html"
         aria-label="Catequizandos">
        <img src="./assets/BTN-CATEQUIS.png"
             alt="Catequizandos">
      </a>

      <a class="boton" href="./misses.html"
         aria-label="Catequistas">
        <img src="./assets/BTN_CATEQUISTAS.png"
             alt="Catequistas">
      </a>

      <a class="boton" href="./supervisores.html"
         aria-label="Coordinador parroquial">
        <img src="./assets/BTN_COORDINADOR.png"
             alt="Coordinador parroquial">
      </a>

      <a class="boton" href="./padres.html"
         aria-label="Padres">
        <img src="./assets/BTN-PADRES.png"
             alt="Padres">
      </a>

      <a class="boton" href="./programacion.html"
         aria-label="Nuestra programación">
        <img src="./assets/BTN-PROGRAMACION.png"
             alt="Nuestra programación">
      </a>

    </nav>

    <section class="zona-portada" aria-label="Portada principal">
      <img
        class="portada"
        src="./assets/PORTAL%20CATEQUESIS.png"
        alt="Camino hacia Jesús, Catequesis del Colegio La Salle del Sur">
    </section>

  </main>

  <script>
    const musica = document.getElementById("musica");
    const mute = document.getElementById("mute");

    function actualizarBoton() {
      mute.textContent = musica.muted ? "♪ UNMUTE" : "♪ MUTE";
      mute.setAttribute("aria-pressed", String(musica.muted));
      mute.setAttribute(
        "aria-label",
        musica.muted ? "Activar sonido" : "Silenciar música"
      );
    }

    mute.addEventListener("click", () => {
      musica.muted = !musica.muted;

      if (!musica.muted && musica.paused) {
        musica.play().catch(() => {});
      }

      actualizarBoton();
    });

    window.addEventListener("load", () => {
      musica.muted = false;
      musica.volume = 0.45;
      actualizarBoton();

      musica.play().catch(() => {
        /* Algunos navegadores bloquean el autoplay con sonido. */
      });
    });
  </script>

</body>
</html>
