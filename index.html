<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10275b">
  <title>Camino hacia Jesús - Colegio La Salle del Sur</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      position: relative;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #071a43;
    }

    /* PORTADA: SIEMPRE A LA DERECHA DE LOS BOTONES */
    .portada {
      position: fixed;
      z-index: 1;
      top: 1.5%;
      right: 0.7%;
      bottom: 1.5%;
      left: 9%;

      overflow: hidden;
      background-color: #10275b;
      background-image: url("./assets/PORTAL%20CATEQUESIS.png");
      background-position: center;
      background-repeat: no-repeat;
      background-size: 100% 100%;
      border-radius: 3px;
    }

    /* CINCO BOTONES: COLUMNA IZQUIERDA INDEPENDIENTE */
    .menu {
      position: fixed;
      z-index: 5;
      top: 2%;
      bottom: 2%;
      left: 0.5%;
      width: 7.8%;
      max-width: 108px;

      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      gap: 7px;

      margin: 0;
      padding: 0;
    }

    .boton {
      flex: 1 1 0;
      width: 100%;
      min-width: 0;
      min-height: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0;
      margin: 0;
      border: 0;
      background: transparent;
      box-shadow: none;
      cursor: pointer;
      line-height: 0;
      -webkit-tap-highlight-color: transparent;
    }

    .boton img {
      display: block;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      object-fit: contain;
      object-position: center;
      border: 0;
      margin: 0;
      padding: 0;
    }

    .boton:hover {
      filter: brightness(1.05);
    }

    .boton:active {
      transform: scale(0.98);
    }

    /* FRASE ANIMADA: CIELO SUPERIOR IZQUIERDO DE LA PORTADA */
    .frase-mision {
      position: absolute;
      z-index: 3;
      top: 2%;
      left: 2.5%;
      width: 40%;
      max-width: 440px;
      min-height: 1.4em;

      margin: 0;
      padding: 0;

      color: #0645ad;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(12px, 1.35vw, 20px);
      font-weight: 800;
      font-style: italic;
      line-height: 1.3;
      text-align: left;
      white-space: normal;
      overflow-wrap: break-word;

      text-shadow:
        0 0 2px #ffffff,
        1px 1px 2px rgba(255, 255, 255, 0.95),
        -1px -1px 1px rgba(255, 255, 255, 0.8);

      pointer-events: none;
    }

    .cursor-escritura {
      display: inline-block;
      margin-left: 2px;
      color: #0645ad;
      font-style: normal;
      animation: parpadeo 0.8s steps(1) infinite;
    }

    @keyframes parpadeo {
      50% {
        opacity: 0;
      }
    }

    /* MUTE: ESQUINA SUPERIOR DERECHA */
    .control-audio {
      position: absolute;
      z-index: 10;
      top: 12px;
      right: 12px;

      width: 40px;
      height: 40px;
      padding: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #ffffff;
      background: rgba(10, 35, 83, 0.58);
      border: 1px solid #d7b65d;
      border-radius: 50%;
      font-size: 19px;
      cursor: pointer;
    }

    /* DERECHOS RESERVADOS: TEXTO SIN CUADRO */
    .derechos-reservados {
      position: fixed;
      z-index: 8;
      right: 1%;
      bottom: 1%;

      margin: 0;
      padding: 0;
      max-width: 65%;

      color: #ffffff;
      background: transparent;
      border: none;

      font-size: clamp(9px, 0.8vw, 12px);
      font-weight: 700;
      line-height: 1.3;
      text-align: right;

      text-shadow:
        1px 1px 2px #10275b,
        -1px -1px 2px #10275b,
        0 0 4px #10275b;

      pointer-events: none;
    }

    /* TABLET */
    @media (max-width: 900px) {
      .menu {
        width: 9%;
        max-width: 85px;
        gap: 5px;
      }

      .portada {
        left: 10%;
      }

      .frase-mision {
        width: 43%;
        font-size: clamp(11px, 1.7vw, 16px);
      }

      .control-audio {
        top: 8px;
        right: 8px;
        width: 36px;
        height: 36px;
      }
    }

    /* CELULAR */
    @media (max-width: 600px) {
      .menu {
        top: 1.5%;
        bottom: 1.5%;
        left: 0.5%;
        width: 15%;
        max-width: 70px;
        gap: 4px;
      }

      .portada {
        top: 1%;
        right: 0.5%;
        bottom: 1%;
        left: 16%;
      }

      .frase-mision {
        top: 1.5%;
        left: 2%;
        width: 48%;
        font-size: clamp(9px, 2vw, 12px);
        line-height: 1.2;
      }

      .control-audio {
        top: 6px;
        right: 6px;
        width: 32px;
        height: 32px;
        font-size: 15px;
      }

      .derechos-reservados {
        right: 5px;
        bottom: 5px;
        max-width: 70%;
        font-size: 8px;
      }
    }

    @media (max-width: 380px) {
      .menu {
        width: 16%;
        max-width: 58px;
        gap: 3px;
      }

      .portada {
        left: 17%;
      }

      .frase-mision {
        width: 49%;
        font-size: 9px;
      }

      .derechos-reservados {
        font-size: 7px;
      }
    }
  </style>
</head>

<body>

  <!-- BOTONES FUERA DE LA PORTADA -->
  <nav class="menu" aria-label="Menú principal">

    <button class="boton" type="button"
      data-destino="catequizandos.html"
      aria-label="Catequizandos">
      <img src="./assets/BTN-CATEQUIS.png" alt="Catequizandos">
    </button>

    <button class="boton" type="button"
      data-destino="misses.html"
      aria-label="Catequistas">
      <img src="./assets/BTN_CATEQUISTAS.png" alt="Catequistas">
    </button>

    <button class="boton" type="button"
      data-destino="supervisores.html"
      aria-label="Coordinador parroquial">
      <img src="./assets/BTN_COORDINADOR.png" alt="Coordinador parroquial">
    </button>

    <button class="boton" type="button"
      data-destino="padres.html"
      aria-label="Padres de familia">
      <img src="./assets/BTN-PADRES.png" alt="Padres de familia">
    </button>

    <button class="boton" type="button"
      data-destino="programacion.html"
      aria-label="Programación">
      <img src="./assets/BTN-PROGRAMACION.png" alt="Programación">
    </button>

  </nav>

  <!-- PORTADA PRINCIPAL -->
  <main class="portada" aria-label="Portada de Camino hacia Jesús">

    <div class="frase-mision">
      <span id="textoMision"></span><span class="cursor-escritura">|</span>
    </div>

    <!-- AUDIO -->
    <audio id="musica" loop preload="auto">
      <source
        src="./assets/Alma%20Misionera%20Athenas%20-%20M%C3%BAsica%20Cat%C3%B3lica.mp3"
        type="audio/mpeg">
      <source
        src="./Alma%20Misionera%20Athenas%20-%20M%C3%BAsica%20Cat%C3%B3lica.mp3"
        type="audio/mpeg">
    </audio>

    <button
      id="controlAudio"
      class="control-audio"
      type="button"
      aria-label="Activar música"
      title="Activar o silenciar música">🔊</button>

  </main>

  <!-- DERECHOS RESERVADOS SIN RECUADRO -->
  <footer class="derechos-reservados">
    © Corporación La Salle del Sur. Derechos reservados.
  </footer>

  <script>
    (() => {
      "use strict";

      const musica = document.getElementById("musica");
      const controlAudio = document.getElementById("controlAudio");
      const botones = document.querySelectorAll(".boton");
      const textoMision = document.getElementById("textoMision");

      const frase =
        "Guiamos sus primeros pasos en la fe, acompañamos sus corazones hacia Jesús y sembramos en sus vidas el amor de Dios, para que cada sacramento sea el comienzo de una historia de fe que los acompañe por siempre.";

      let indice = 0;
      let silenciado = false;
      let contextoAudio = null;

      /* ESCRITURA LETRA POR LETRA */
      function escribirFrase() {
        if (indice < frase.length) {
          textoMision.textContent += frase.charAt(indice);
          indice++;
          window.setTimeout(escribirFrase, 48);
        }
      }

      escribirFrase();

      /* INICIO DE MÚSICA */
      async function iniciarMusica() {
        if (silenciado) return;

        try {
          musica.muted = false;
          await musica.play();

          controlAudio.textContent = "🔊";
          controlAudio.setAttribute("aria-label", "Silenciar música");
        } catch (error) {
          controlAudio.textContent = "▶";
          controlAudio.setAttribute(
            "aria-label",
            "Reproducir música"
          );
          console.warn(
            "El navegador bloqueó el audio o no encontró el MP3. Pulsa el control de audio y verifica la ruta del archivo."
          );
        }
      }

      /* INTENTO AUTOMÁTICO: PUEDE SER BLOQUEADO POR EL NAVEGADOR */
      window.addEventListener("load", () => {
        iniciarMusica();
      });

      /* EFECTO BREVE AL PULSAR UN BOTÓN */
      function efectoBoton() {
        try {
          const AudioContext =
            window.AudioContext || window.webkitAudioContext;

          if (!AudioContext) return;

          if (!contextoAudio) {
            contextoAudio = new AudioContext();
          }

          const reproducir = () => {
            const ahora = contextoAudio.currentTime;
            const tono = contextoAudio.createOscillator();
            const volumen = contextoAudio.createGain();

            tono.type = "sine";
            tono.frequency.setValueAtTime(880, ahora);
            tono.frequency.exponentialRampToValueAtTime(
              660, ahora + 0.12
            );

            volumen.gain.setValueAtTime(0.0001, ahora);
            volumen.gain.linearRampToValueAtTime(0.07, ahora + 0.015);
            volumen.gain.exponentialRampToValueAtTime(
              0.0001, ahora + 0.16
            );

            tono.connect(volumen);
            volumen.connect(contextoAudio.destination);

            tono.start(ahora);
            tono.stop(ahora + 0.17);
          };

          if (contextoAudio.state === "suspended") {
            contextoAudio.resume().then(reproducir).catch(() => {});
          } else {
            reproducir();
          }
        } catch (error) {
          console.warn("No se pudo reproducir el efecto de sonido.");
        }
      }

      /* NAVEGACIÓN */
      botones.forEach((boton) => {
        boton.addEventListener("click", () => {
          efectoBoton();

          const destino = boton.getAttribute("data-destino");
          if (destino) {
            window.location.href = destino;
          }
        });
      });

      /* BOTÓN MUTE / ACTIVAR MÚSICA */
      controlAudio.addEventListener("click", async () => {
        if (!silenciado) {
          silenciado = true;
          musica.muted = true;
          controlAudio.textContent = "🔇";
          controlAudio.setAttribute("aria-label", "Activar música");
        } else {
          silenciado = false;
          musica.muted = false;
          await iniciarMusica();
        }
      });

      musica.addEventListener("playing", () => {
        controlAudio.textContent = silenciado ? "🔇" : "🔊";
      });

      musica.addEventListener("error", () => {
        controlAudio.textContent = "▶";
        console.error(
          "No se pudo cargar el MP3. Comprueba que el archivo exista en assets y que su nombre coincida exactamente."
        );
      });
    })();
  </script>

</body>
</html>
