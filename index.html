<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071b38">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Camino hacia Jesús">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./assets/insignia.png">
  <title>Camino hacia Jesús - Colegio La Salle del Sur</title>
  <link rel="preload" as="image" href="./assets/PORTAL%20CATEQUESIS.png" fetchpriority="high">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      position: relative;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #02091f;
      display: flex;
    }

    /* PORTADA PRINCIPAL */
    .portada {
      position: relative;
      flex-grow: 1;
      height: 100%;
      overflow: hidden;
      background-color: #02091f;
      background-image: url("./assets/PORTAL%20CATEQUESIS.png");
      background-position: center center;
      background-repeat: no-repeat;
      background-size: cover;
    }

    /* PANEL LATERAL DERECHO LIMPIO Y ELEGANTE */
    .panel-menu {
      position: relative;
      z-index: 5;
      width: 160px;
      min-width: 140px;
      height: 100%;
      background: linear-gradient(135deg, #061a38 0%, #020d22 100%);
      border-left: 2px solid rgba(215, 182, 93, 0.4);
      box-shadow: -5px 0 20px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      align-items: center;
      padding: 10px 8px;
    }

    .menu {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      align-items: center;
      gap: 5px;
      margin: 0;
      padding: 0;
    }

    .menu-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      flex: 1;
      justify-content: center;
    }

    /* BOTONES LIMPIOS Y ELEGANTE */
    .boton {
      width: 85%;
      max-width: 110px;
      height: 70%;
      max-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      padding: 0;
      border: none;
      background: transparent;
      cursor: pointer;
      line-height: 0;
      overflow: visible;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.25s ease, filter 0.25s ease;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.6));
    }

    .boton img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      border: none;
      margin: 0;
      padding: 0;
      transition: transform 0.25s ease;
    }

    .boton:hover {
      transform: scale(1.08);
      filter: drop-shadow(0 0 12px rgba(245, 212, 119, 0.8)) brightness(1.15);
    }

    .boton:active {
      transform: scale(0.95);
    }

    /* EFECTO VISIBLE AL HACER CLIC */
    .boton.clicado {
      transform: scale(1.2);
      z-index: 99;
      filter: drop-shadow(0 0 20px #f5d477) brightness(1.25);
    }

    /* NOMBRE DE CADA BOTÓN DEBAJO */
    .nombre-opcion {
      margin-top: 3px;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(8px, 0.85vw, 11px);
      font-weight: 800;
      text-align: center;
      line-height: 1.1;
      text-shadow: 0 1px 2px #000, 0 0 5px rgba(255, 255, 255, 0.5);
      width: 100%;
      padding: 0 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* BOTÓN DE AUDIO */
    .control-audio {
      position: absolute;
      z-index: 10;
      top: 14px;
      left: 14px;
      width: 42px;
      height: 42px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      background: rgba(10, 35, 83, 0.8);
      border: 2px solid #ffffff;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .control-audio:hover {
      transform: scale(1.1);
      background: rgba(20, 55, 120, 0.95);
    }

    /* DERECHOS RESERVADOS */
    .derechos-reservados {
      position: fixed;
      z-index: 8;
      left: 5%;
      width: calc(100% - 160px);
      bottom: 1.2%;
      margin: 0;
      padding: 0;
      color: #ffffff;
      background: transparent;
      border: none;
      font-size: clamp(11px, 1vw, 15px);
      font-weight: 800;
      line-height: 1.3;
      text-align: center;
      text-shadow:
        -1px -1px 2px #002d83,
         1px -1px 2px #002d83,
        -1px  1px 2px #002d83,
         1px  1px 2px #002d83,
         0 0 5px #002d83;
      pointer-events: none;
    }

    /* Diseño adaptable: el menú lateral pasa a una cuadrícula en tablet y celular. */
    @media (max-width: 820px) {
      html, body { width: 100%; height: auto; min-height: 100%; overflow-x: hidden; }
      body {
        min-height: 100dvh;
        height: auto;
        display: flex;
        flex-direction: column;
        overflow-x: hidden;
        overflow-y: auto;
      }
      .portada {
        width: 100%;
        height: clamp(240px, 43svh, 390px);
        min-height: 240px;
        max-height: 390px;
        flex: 0 0 auto;
        background-position: center center;
        background-size: cover;
      }
      .panel-menu {
        width: 100%;
        min-width: 0;
        height: auto;
        flex: 0 0 auto;
        padding: 14px 12px calc(14px + env(safe-area-inset-bottom));
        border-left: 0;
        border-top: 2px solid rgba(215, 182, 93, 0.4);
        box-shadow: none;
      }
      .menu {
        width: 100%;
        height: auto;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        align-items: start;
        justify-content: stretch;
        gap: 14px 10px;
      }
      .menu-item {
        width: 100%;
        min-width: 0;
        min-height: 108px;
        flex: none;
        gap: 5px;
      }
      .boton {
        width: min(100%, 104px);
        height: clamp(68px, 13vw, 86px);
        max-height: none;
        flex: 0 0 auto;
        overflow: hidden;
        text-decoration: none;
      }
      .boton img { width: 100%; height: 100%; object-fit: contain; }
      .nombre-opcion {
        width: 100%;
        padding: 0 2px;
        font-size: clamp(10px, 2.2vw, 12px);
        line-height: 1.2;
        white-space: normal;
        overflow: visible;
        text-overflow: clip;
      }
      .derechos-reservados {
        position: static;
        width: 100%;
        left: auto;
        bottom: auto;
        margin: 0;
        padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
        font-size: 11px;
        line-height: 1.4;
        text-align: center;
      }
      .pwa-install-button { top: 62px; left: 10px; }
    }

    @media (max-width: 480px) {
      .portada { height: clamp(230px, 39svh, 320px); min-height: 230px; }
      .menu { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 8px; }
      .menu-item { min-height: 102px; }
      .boton { width: min(100%, 98px); height: 74px; }
      .nombre-opcion { font-size: 11px; }
    }


    /* Instalación PWA: control discreto; se oculta después de instalar. */
    .pwa-install-button {
      position: fixed; left: 14px; top: 66px; z-index: 30;
      display: inline-flex; align-items: center; gap: 8px;
      padding: 9px 13px; border: 1px solid rgba(245,212,119,.75);
      border-radius: 999px; color: #071b38;
      background: linear-gradient(135deg,#fff0b8,#f2d477);
      box-shadow: 0 4px 14px rgba(0,0,0,.28);
      font: 800 12px Arial, sans-serif; cursor: pointer;
    }
    .pwa-install-button[hidden] { display: none !important; }
    .pwa-install-button:active { transform: scale(.97); }
    @media(max-width:600px) { .pwa-install-button { top:62px; left:10px; font-size:11px; padding:8px 10px; } }
  </style>

<style id="lds-copyright-standard">

  display:block!important;

  box-sizing:border-box!important;

  background:linear-gradient(105deg,#0a1c39,#18395f)!important;
  border-top:2px solid #d4ae55!important;
  font-family:inherit!important;
  font-size:12px!important;
  font-weight:700!important;

  letter-spacing:.02em!important;
}
.lds-copyright-footer{margin-top:24px!important}

</head>

<body>


  <button id="pwaInstallButton" class="pwa-install-button" type="button" hidden aria-label="Descargar aplicación Camino hacia Jesús">⬇ Descargar aplicación</button>

  <!-- PORTADA PRINCIPAL -->
  <main class="portada" aria-label="Camino hacia Jesús">

    <!-- MÚSICA -->
    <audio id="musica" loop preload="none">
      <source
        src="./alma-misionera-athenas-musica-catolica.mp3"
        type="audio/mpeg">
    </audio>

    <!-- ÚNICO CONTROL DE AUDIO -->
    <button
      id="controlAudio"
      class="control-audio"
      type="button"
      aria-label="Reproducir música"
      title="Activar o silenciar música">🔊</button>

  </main>

  <!-- PANEL LATERAL DERECHO DE BOTONES -->
  <aside class="panel-menu" aria-label="Menú principal">
    <nav class="menu">

      <!-- 1. NUESTRA PROGRAMACIÓN -->
      <div class="menu-item">
        <a class="boton" href="./programacion.html" data-destino="programacion.html" aria-label="Nuestra Programación">
          <img src="./assets/BTN-PROGRAMACION.png" alt="Nuestra Programación" loading="lazy" decoding="async" fetchpriority="low">
        </a>
        <span class="nombre-opcion">Programación</span>
      </div>

      <!-- 2. CATEQUIZANDOS -->
      <div class="menu-item">
        <a class="boton" href="./catequizandos.html?ingreso=pin" data-destino="catequizandos.html?ingreso=pin" aria-label="Catequizandos">
          <img src="./assets/BTN-CATEQUIS.png" alt="Catequizandos" loading="lazy" decoding="async" fetchpriority="low">
        </a>
        <span class="nombre-opcion">Catequizandos</span>
      </div>

      <!-- 3. CATEQUISTAS -->
      <div class="menu-item">
        <a class="boton" href="./CATEQUISTA.html" data-destino="CATEQUISTA.html" aria-label="Catequistas">
          <img src="./assets/BTN_CATEQUISTAS.png" alt="Catequistas" loading="lazy" decoding="async" fetchpriority="low">
        </a>
        <span class="nombre-opcion">Catequistas</span>
      </div>

      <!-- 4. PADRES DE FAMILIA -->
      <div class="menu-item">
        <a class="boton" href="./padres.html" data-destino="padres.html" aria-label="Padres de familia">
          <img src="./assets/BTN-PADRES.png" alt="Padres de familia" loading="lazy" decoding="async" fetchpriority="low">
        </a>
        <span class="nombre-opcion">Padres</span>
      </div>

 <!-- 5. GESTORES: módulo Gestor Pastoral -->
<div class="menu-item">
  <a class="boton" href="./GestorPastoral.html" data-destino="GestorPastoral.html" aria-label="Gestores">
    <img src="./assets/BTN_COORDINADOR.png" alt="Gestores" loading="lazy" decoding="async" fetchpriority="low">
  </a>
  <span class="nombre-opcion">Gestores</span>
</div>
    </nav>
  </aside>

  <!-- DERECHOS RESERVADOS -->
  <footer class="derechos-reservados lds-copyright-line">
    © 2026 Colegio Privado La Salle del Sur. Todos los derechos reservados.
  </footer>

  <script>
    (() => {
      "use strict";

      const musica = document.getElementById("musica");
      const controlAudio = document.getElementById("controlAudio");
      const botones = document.querySelectorAll(".boton");

      let silenciado = false;
      let contextoAudio = null;

      /* INICIAR AUDIO Y DESBLOQUEAR NAVEGADOR */
      async function iniciarMusica() {
        if (silenciado) return;

        try {
          musica.muted = false;
          musica.volume = 0.2;
          await musica.play();
          controlAudio.textContent = "🔊";
        } catch (error) {
          controlAudio.textContent = "▶";
        }
      }

      /* EFECTO SONORO DE CLIC GARANTIZADO */
      function reproducirSonidoClic() {
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;

          if (!contextoAudio) {
            contextoAudio = new AudioContext();
          }

          if (contextoAudio.state === "suspended") {
            contextoAudio.resume();
          }

          const ahora = contextoAudio.currentTime;
          const osc = contextoAudio.createOscillator();
          const gain = contextoAudio.createGain();

          osc.type = "triangle";
          osc.frequency.setValueAtTime(440, ahora);
          osc.frequency.exponentialRampToValueAtTime(880, ahora + 0.07);

          gain.gain.setValueAtTime(0.001, ahora);
          gain.gain.linearRampToValueAtTime(0.13, ahora + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.001, ahora + 0.11);

          osc.connect(gain);
          gain.connect(contextoAudio.destination);

          osc.start(ahora);
          osc.stop(ahora + 0.12);
        } catch (e) {
          // Ignorar si el navegador bloquea
        }
      }

      /* NAVEGACIÓN CON EFECTO VISIBLE Y TIEMPO PARA APRECIAR EL AUDIO */
      // Los enlaces conservan su navegación nativa; el sonido es solo un efecto adicional.
      botones.forEach((enlace) => {
        enlace.addEventListener("click", () => {
          reproducirSonidoClic();
        });
      });

      /* CONTROL DE AUDIO MANUAL */
      controlAudio.addEventListener("click", async () => {
        reproducirSonidoClic();
        if (!silenciado) {
          silenciado = true;
          musica.muted = true;
          controlAudio.textContent = "🔇";
        } else {
          silenciado = false;
          musica.muted = false;
          await iniciarMusica();
        }
      });

      /* ACTIVAR MÚSICA AL CARGAR O PRIMER CLIC EN LA PÁGINA */
      window.addEventListener("load", () => {
        iniciarMusica();
      }, { once: true });

      document.body.addEventListener("click", () => {
        if (musica.paused && !silenciado) {
          iniciarMusica();
        }
      }, { once: true });

    })();
  </script>


  <script>
    // Instalación PWA: el botón permanece visible hasta que la app esté instalada.
    (() => {
      'use strict';
      const button = document.getElementById('pwaInstallButton');
      // Nueva clave para no heredar marcas antiguas que podrían ocultar el botón por error.
      const storageKey = 'camino_hacia_jesus_instalada_v3';
      const standaloneQuery = window.matchMedia('(display-mode: standalone)');
      const isStandalone = () =>
        standaloneQuery.matches ||
        window.matchMedia('(display-mode: minimal-ui)').matches ||
        window.matchMedia('(display-mode: fullscreen)').matches ||
        navigator.standalone === true;

      let installPrompt = null;

      const hideInstallControl = (installed) => {
        if (!button) return;
        button.hidden = true;
        if (installed) {
          try { localStorage.setItem(storageKey, '1'); } catch (e) {}
        }
      };

      const alreadyInstalled = () => {
        try { return localStorage.getItem(storageKey) === '1'; }
        catch (e) { return false; }
      };

      const showInstallControl = () => {
        if (!button) return;
        if (isStandalone() || alreadyInstalled()) {
          hideInstallControl(false);
          return;
        }
        button.hidden = false;
        button.textContent = '⬇ Descargar aplicación';
        button.setAttribute('aria-label', 'Descargar aplicación Camino hacia Jesús');
        button.title = 'Instala Camino hacia Jesús en tu dispositivo';
      };

      if (button) showInstallControl();

      window.addEventListener('beforeinstallprompt', (event) => {
        if (!button || isStandalone() || alreadyInstalled()) return;
        event.preventDefault();
        installPrompt = event;
        showInstallControl();
      });

      if (button) {
        button.addEventListener('click', async () => {
          if (isStandalone() || alreadyInstalled()) {
            hideInstallControl(false);
            return;
          }

          if (installPrompt) {
            const promptEvent = installPrompt;
            installPrompt = null;
            try {
              await promptEvent.prompt();
              const choice = await promptEvent.userChoice;
              if (choice && choice.outcome === 'accepted') {
                // El usuario aceptó la instalación: no volver a mostrar el botón.
                hideInstallControl(true);
              } else {
                // Si cancela, el botón permanece para que pueda intentarlo después.
                showInstallControl();
              }
            } catch (error) {
              console.warn('No se pudo completar la solicitud de instalación:', error);
              showInstallControl();
            }
            return;
          }

          // Instrucciones para navegadores que no exponen beforeinstallprompt.
          const ua = navigator.userAgent || '';
          const isIOS = /iphone|ipad|ipod/i.test(ua) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
          const isAndroid = /android/i.test(ua);

          if (isIOS) {
            alert('Para descargar Camino hacia Jesús: pulsa Compartir en Safari y elige “Añadir a pantalla de inicio”. Luego abre la aplicación desde el nuevo icono.');
          } else if (isAndroid) {
            alert('Para descargar Camino hacia Jesús: abre el menú ⋮ de Chrome y selecciona “Instalar aplicación” o “Añadir a pantalla de inicio”.');
          } else {
            alert('Para instalar Camino hacia Jesús: en Chrome o Edge abre el menú del navegador y selecciona “Instalar aplicación” o “Instalar este sitio como aplicación”.');
          }
        });
      }

      window.addEventListener('appinstalled', () => {
        installPrompt = null;
        hideInstallControl(true);
      });

      window.addEventListener('pageshow', showInstallControl);
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) showInstallControl();
      });
      if (standaloneQuery.addEventListener) {
        standaloneQuery.addEventListener('change', showInstallControl);
      } else if (standaloneQuery.addListener) {
        standaloneQuery.addListener(showInstallControl);
      }

      // Registrar el Service Worker al terminar el parseo, sin esperar imágenes grandes.
      if ('serviceWorker' in navigator) {
        const registrarSW = () => {
          navigator.serviceWorker.register('./service-worker.js', { scope: './' })
            .then(() => console.info('Camino hacia Jesús está listo para instalarse.'))
            .catch((error) => console.warn('No se pudo registrar el servicio de instalación:', error));
        };
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', registrarSW, { once: true });
        } else {
          registrarSW();
        }
      }
    })();
  </script>

</body>
