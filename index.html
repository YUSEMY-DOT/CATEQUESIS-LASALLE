
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071d49">
  <title>Camino hacia Jesús | Catequesis La Salle del Sur</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      background-color: #071d49;
      background-image: url("./assets/PORTAL%20CATEQUESIS.png");
      background-repeat: no-repeat;
      background-position: center center;
      background-size: cover;
      font-family: Arial, sans-serif;
    }

    .contenedor {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      padding: 12px;
    }

    .menu {
      width: 140px;
      flex: 0 0 140px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 9px;
    }

    .boton {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      padding: 2px;
      overflow: hidden;
      background: #071d49;
      border: 2px solid #d8b45a;
      border-radius: 9px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      transition: transform 0.15s ease;
    }

    .boton:hover {
      transform: scale(1.03);
    }

    .boton:focus-visible {
      outline: 3px solid white;
      outline-offset: 3px;
    }

    .boton img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    @media (max-width: 600px) {
      .contenedor {
        padding: 7px;
      }

      .menu {
        width: 82px;
        flex-basis: 82px;
        gap: 6px;
      }

      .boton {
        padding: 1px;
        border-width: 1px;
        border-radius: 6px;
      }
    }

    @media (max-width: 380px) {
      .menu {
        width: 72px;
        flex-basis: 72px;
        gap: 5px;
      }
    }

    @media (min-width: 601px) and (max-height: 600px) {
      .contenedor {
        padding: 5px;
      }

      .menu {
        width: 95px;
        flex-basis: 95px;
        gap: 4px;
      }

      .boton {
        border-radius: 5px;
        padding: 1px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .boton {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="contenedor">
    <nav class="menu" aria-label="Menú de catequesis">

      <a class="boton" href="./catequizandos.html"
         aria-label="Catequizandos">
        <img src="./assets/BTN-CATEQUIS.png"
             alt="Catequizandos">
      </a>

      <a class="boton" href="./misses.html"
         aria-label="Catequistas">
        <img src="./assets/BTN_CATEQUISTAS.png"
             alt="Catequistas">
      </a>

      <a class="boton" href="./supervisores.html"
         aria-label="Coordinador parroquial">
        <img src="./assets/BTN_COORDINADOR.png"
             alt="Coordinador parroquial">
      </a>

      <a class="boton" href="./padres.html"
         aria-label="Padres">
        <img src="./assets/BTN-PADRES.png"
             alt="Padres">
      </a>

      <a class="boton" href="./programacion.html"
         aria-label="Nuestra programación">
        <img src="./assets/BTN-PROGRAMACION.png"
             alt="Nuestra programación">
      </a>

    </nav>
  </main>
</body>
</html>
