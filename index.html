
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10275b">
  <title>Camino hacia Jesús - Colegio La Salle del Sur</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      position: relative;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #10275b;
      background-image: url("./assets/PORTAL%20CATEQUESIS.png");
      background-position: center center;
      background-repeat: no-repeat;
      background-size: 100% 100%;
    }

    /* ======================================
       COLUMNA IZQUIERDA: CINCO BOTONES
       ====================================== */

    .menu {
      position: fixed;
      z-index: 5;
      top: 2.2%;
      bottom: 2.2%;
      left: 0.7%;

      width: 7.5%;
      max-width: 105px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 8px;

      padding: 0;
      margin: 0;
    }

    .boton {
      flex: 1 1 0;
      min-width: 0;
      min-height: 0;
      width: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0;
      margin: 0;

      border: none;
      outline: none;
      background: transparent;
      box-shadow: none;

      cursor: pointer;
      line-height: 0;
      -webkit-tap-highlight-color: transparent;
    }

    .boton img {
      display: block;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;

      object-fit: contain;
      object-position: center;

      padding: 0;
      margin: 0;
      border: none;
    }

    .boton:hover {
      filter: brightness(1.05);
    }

    .boton:active {
      transform: scale(0.98);
    }

    /* ======================================
       FRASE: CIELO SUPERIOR IZQUIERDO
       ====================================== */

    .frase-mision {
      position: fixed;
      z-index: 2;

      top: 2.5%;
      left: 11%;
      width: 32%;
      max-width: 440px;

      margin: 0;
      padding: 0;

      color: #0645ad;
      -webkit-text-fill-color: #0645ad;
      -webkit-text-stroke: 0;

      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(12px, 1.35vw, 20px);
      font-weight: 800;
      font-style: italic;
      line-height: 1.3;
      text-align: left;

      text-shadow:
        0 0 2px #ffffff,
        1px 1px 2px rgba(255, 255, 255, 0.95),
        -1px -1px 1px rgba(255, 255, 255, 0.75);

      pointer-events: none;
    }

    /* ======================================
       CONTROL DE MÚSICA: ESQUINA SUPERIOR DERECHA
       ====================================== */

    .control-audio {
      position: fixed;
      z-index: 10;
      top: 12px;
      right: 14px;

      width: 40px;
      height: 40px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0;
      color: #ffffff;
      background: rgba(10, 35, 83, 0.55);

      border: 1px solid #d7b65d;
      border-radius: 50%;

      font-size: 19px;
      cursor: pointer;
    }

    /* ======================================
       DERECHOS RESERVADOS: SOLO TEXTO
       ====================================== */

    .derechos-reservados {
      position: fixed;
      z-index: 8;

      right: 1%;
      bottom: 1.1%;

      max-width: 55%;
      margin: 0;
      padding: 0;

      color: #ffffff;
      background: transparent;
      border: none;
      border-radius: 0;

      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(9px, 0.8vw, 12px);
      font-weight: 700;
      line-height: 1.3;
      text-align: right;

      text-shadow:
        1px 1px 2px #10275b,
        -1px -1px 2px #10275b,
        0 0 4px #10275b;

      pointer-events: none;
    }

    /* ======================================
       TABLET
       ====================================== */

    @media (max-width: 900px) {
      .menu {
        width: 10%;
        max-width: 95px;
        left: 0.5%;
        gap: 5px;
      }

      .frase-mision {
        left: 12%;
        width: 34%;
        font-size: clamp(11px, 1.7vw, 16px);
      }

      .control-audio {
        top: 9px;
        right: 9px;
        width: 36px;
        height: 36px;
      }
    }

    /* ======================================
       CELULAR
       ====================================== */

    @media (max-width: 600px) {
      .menu {
        top: 1.5%;
        bottom: 1.5%;
        left: 0.5%;

        width: 16%;
        max-width: 78px;
        gap: 4px;
      }

      .frase-mision {
        top: 1.5%;
        left: 18%;
        width: 37%;
        font-size: clamp(9px, 2.1vw, 12px);
        line-height: 1.2;
      }

      .control-audio {
        top: 7px;
        right: 7px;
        width: 32px;
        height: 32px;
        font-size: 15px;
      }

      .derechos-reservados {
        right: 5px;
        bottom: 5px;
        max-width: 65%;
        font-size: 8px;
      }
    }

    @media (max-width: 380px) {
      .menu {
        width: 17%;
        max-width: 65px;
        gap: 3px;
      }

      .frase-mision {
        left: 19%;
        width: 38%;
        font-size: 9px;
      }

      .derechos-reservados {
        max-width: 68%;
        font-size: 7px;
      }
    }
  </style>
</head>

<body>

  <!-- FRASE INSTITUCIONAL -->
  <div class="frase-mision">
    Guiamos sus primeros pasos en la fe,
    acompañamos sus corazones hacia Jesús
    y sembramos en sus vidas el amor de Dios,
    para que cada sacramento sea el comienzo
    de una historia de fe que los acompañe
    por siempre.
  </div>

  <!-- MENÚ PRINCIPAL: NO CAMBIAR LOS DESTINOS -->
  <nav class="menu" aria-label="Menú principal">

    <button
      class="boton"
      type="button"
      data-destino="catequizandos.html"
      aria-label="Catequizandos">
      <img
        src="./assets/BTN-CATEQUIS.png"
        alt="Catequizandos">
    </button>

    <button
      class="boton"
      type="button"
      data-destino="misses.html"
      aria-label="Catequistas">
      <img
        src="./assets/BTN_CATEQUISTAS.png"
        alt="Catequistas">
    </button>

    <button
      class="boton"
      type="button"
      data-destino="supervisores.html"
      aria-label="Coordinador parroquial">
      <img
        src="./assets/BTN_COORDINADOR.png"
        alt="Coordinador parroquial">
    </button>

    <button
      class="boton"
      type="button"
      data-destino="padres.html"
      aria-label="Padres de familia">
      <img
        src="./assets/BTN-PADRES.png"
        alt="Padres de familia">
    </button>

    <button
      class="boton"
      type="button"
      data-destino="programacion.html"
      aria-label="Programación">
      <img
        src="./assets/BTN-PROGRAMACION.png"
        alt="Programación">
    </button>

  </nav>

  <!-- MÚSICA DE FONDO: CONSERVA LAS RUTAS EXISTENTES -->
  <audio id="musica" loop preload="auto">
    <source
      src="./assets/Alma%20Misionera%20Athenas%20-%20M%C3%BAsica%20Cat%C3%B3lica.mp3"
      type="audio/mpeg">

    <source
      src="./Alma%20Misionera%20Athenas%20-%20M%C3%BAsica%20Cat%C3%B3lica.mp3"
      type="audio/mpeg">
  </audio>

  <!-- ÚNICO CONTROL DE AUDIO -->
  <button
    id="controlAudio"
    class="control-audio"
    type="button"
    aria-label="Silenciar música"
    title="Activar o silenciar música">🔊</button>

  <!-- DERECHOS RESERVADOS, SIN RECUADRO -->
  <footer class="derechos-reservados">
    © Corporación La Salle del Sur. Derechos reservados.
  </footer>

  <script>
    (() => {
      "use strict";

      const musica = document.getElementById("musica");
      const controlAudio = document.getElementById("controlAudio");
      const botones = document.querySelectorAll(".boton");

      let silenciado = false;
      let contextoAudio = null;

      /* EFECTO CORTO AL PULSAR LOS BOTONES */
      function efectoBoton() {
        try {
          const AudioContext =
            window.AudioContext || window.webkitAudioContext;

          if (!AudioContext) return;

          if (!contextoAudio) {
            contextoAudio = new AudioContext();
          }

          const reproducir = () => {
            const ahora = contextoAudio.currentTime;
            const tono = contextoAudio.createOscillator();
            const volumen = contextoAudio.createGain();

            tono.type = "sine";
            tono.frequency.setValueAtTime(880, ahora);
            tono.frequency.exponentialRampToValueAtTime(
              660,
              ahora + 0.12
            );

            volumen.gain.setValueAtTime(0.0001, ahora);
            volumen.gain.linearRampToValueAtTime(
              0.08,
              ahora + 0.015
            );
            volumen.gain.exponentialRampToValueAtTime(
              0.0001,
              ahora + 0.16
            );

            tono.connect(volumen);
            volumen.connect(contextoAudio.destination);

            tono.start(ahora);
            tono.stop(ahora + 0.17);
          };

          if (contextoAudio.state === "suspended") {
            contextoAudio.resume()
              .then(reproducir)
              .catch(() => {});
          } else {
            reproducir();
          }
        } catch (error) {
          console.warn("No se pudo reproducir el efecto de sonido.");
        }
      }

      /* INICIAR MÚSICA */
      async function iniciarMusica() {
        if (silenciado) return;

        try {
          musica.muted = false;
          await musica.play();

          controlAudio.textContent = "🔊";
          controlAudio.setAttribute(
            "aria-label",
            "Silenciar música"
          );
        } catch (error) {
          console.warn(
            "La reproducción automática puede estar bloqueada. Pulsa el botón de audio para iniciar la música."
          );
        }
      }

      /*
       * El navegador puede impedir el autoplay.
       * Por eso se intenta al cargar y también al interactuar.
       */
      window.addEventListener("load", () => {
        iniciarMusica();
      });

      /* NAVEGACIÓN DE LOS CINCO BOTONES */
      botones.forEach((boton) => {
        boton.addEventListener("click", () => {
          efectoBoton();

          const destino = boton.getAttribute("data-destino");

          if (destino) {
            window.location.href = destino;
          }
        });
      });

      /* ACTIVAR / SILENCIAR MÚSICA */
      controlAudio.addEventListener("click", async () => {
        silenciado = !silenciado;
        musica.muted = silenciado;

        if (silenciado) {
          controlAudio.textContent = "🔇";
          controlAudio.setAttribute(
            "aria-label",
            "Activar música"
          );
        } else {
          controlAudio.textContent = "🔊";
          controlAudio.setAttribute(
            "aria-label",
            "Silenciar música"
          );

          await iniciarMusica();
        }
      });

      musica.addEventListener("error", () => {
        console.error(
          "No se encuentra el archivo de música. Verifica su nombre y ubicación en GitHub."
        );
      });
    })();
  </script>

</body>
</html>
