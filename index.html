<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10275b">
  <title>Camino hacia Jesús | La Salle del Sur</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #10275b;
      background-image: url("./assets/PORTAL%20CATEQUESIS.png");
      background-repeat: no-repeat;
      background-position: center center;
      background-size: cover;
    }

    .menu {
      position: absolute;
      z-index: 5;
      top: 50%;
      left: 1.5%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
      width: 23%;
      max-width: 280px;
    }

    .boton {
      display: block;
      width: 100%;
      padding: 0;
      margin: 0;
      border: none;
      outline: none;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.18s ease;
    }

    .boton:hover {
      transform: scale(1.035);
    }

    .boton:active {
      transform: scale(0.97);
    }

    .boton img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
      border: 0;
    }

    .zona-portada {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .frase-mision {
      position: absolute;
      top: 1%;
      left: 27%;
      width: min(35%, 500px);
      color: #1746b8;
      font-size: clamp(15px, 1.8vw, 25px);
      line-height: 1.35;
      font-weight: 800;
      font-style: italic;
      text-align: center;
      -webkit-text-stroke: 0.35px white;
      text-shadow:
        1px 1px 2px white,
        -1px -1px 2px white,
        0 0 5px white;
      white-space: normal;
    }

    .control-audio {
      position: fixed;
      z-index: 10;
      right: 14px;
      bottom: 14px;
      width: 44px;
      height: 44px;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 1px solid rgba(255, 215, 120, 0.9);
      border-radius: 50%;
      background: rgba(16, 39, 91, 0.82);
      color: white;
      font-size: 21px;
      cursor: pointer;
    }

    @media (max-width: 700px) {
      .menu {
        left: 1%;
        width: 30%;
        max-width: none;
        gap: 7px;
      }

      .frase-mision {
        top: 1%;
        left: 32%;
        width: 54%;
        font-size: clamp(12px, 3.2vw, 19px);
        line-height: 1.25;
      }

      .control-audio {
        right: 8px;
        bottom: 8px;
        width: 38px;
        height: 38px;
      }
    }
  </style>
</head>

<body>

  <main class="zona-portada">
    <div class="frase-mision" id="fraseMision">
      Guiamos sus primeros pasos en la fe, acompañamos sus corazones
      hacia Jesús y sembramos en sus vidas el amor de Dios, para que
      cada sacramento sea el comienzo de una historia de fe que los
      acompañe por siempre.
    </div>
  </main>

  <nav class="menu" aria-label="Menú principal">

    <button class="boton" type="button"
      data-destino="?p=catequizandos"
      aria-label="Catequizandos">
      <img src="./assets/BTN-CATEQUIS.png"
        alt="Catequizandos">
    </button>

    <button class="boton" type="button"
      data-destino="?p=misses"
      aria-label="Catequistas">
      <img src="./assets/BTN_CATEQUISTAS.png"
        alt="Catequistas">
    </button>

    <button class="boton" type="button"
      data-destino="?p=supervisores"
      aria-label="Coordinador parroquial">
      <img src="./assets/BTN_COORDINADOR.png"
        alt="Coordinador parroquial">
    </button>

    <button class="boton" type="button"
      data-destino="?p=padres"
      aria-label="Padres de familia">
      <img src="./assets/BTN-PADRES.png"
        alt="Padres de familia">
    </button>

    <button class="boton" type="button"
      data-destino="?p=programacion"
      aria-label="Programación">
      <img src="./assets/BTN-PROGRAMACION.png"
        alt="Programación">
    </button>

  </nav>

  <audio id="musica" loop preload="auto">
    <source
      src="./assets/Alma%20Misionera%20Athenas%20-%20M%C3%BAsica%20Cat%C3%B3lica.mp3"
      type="audio/mpeg">
  </audio>

  <button
    class="control-audio"
    id="controlAudio"
    type="button"
    aria-label="Silenciar o activar música"
    title="Silenciar o activar música">🔊</button>

  <script>
    (() => {
      "use strict";

      const musica = document.getElementById("musica");
      const controlAudio = document.getElementById("controlAudio");
      const botones = document.querySelectorAll(".boton");

      let silenciado = false;
      let contextoAudio = null;

      /*
       * Efecto breve de sonido generado por el navegador.
       * No requiere descargar otro archivo de audio.
       */
      function reproducirEfecto() {
        try {
          const AudioContext =
            window.AudioContext || window.webkitAudioContext;

          if (!AudioContext) return;

          if (!contextoAudio) {
            contextoAudio = new AudioContext();
          }

          if (contextoAudio.state === "suspended") {
            contextoAudio.resume();
          }

          const oscilador = contextoAudio.createOscillator();
          const volumen = contextoAudio.createGain();
          const ahora = contextoAudio.currentTime;

          oscilador.type = "sine";
          oscilador.frequency.setValueAtTime(880, ahora);
          oscilador.frequency.exponentialRampToValueAtTime(
            660,
            ahora + 0.12
          );

          volumen.gain.setValueAtTime(0.0001, ahora);
          volumen.gain.exponentialRampToValueAtTime(
            0.12,
            ahora + 0.015
          );
          volumen.gain.exponentialRampToValueAtTime(
            0.0001,
            ahora + 0.16
          );

          oscilador.connect(volumen);
          volumen.connect(contextoAudio.destination);

          oscilador.start(ahora);
          oscilador.stop(ahora + 0.17);
        } catch (error) {
          console.warn("No se pudo reproducir el efecto de sonido.");
        }
      }

      /*
       * La música intenta iniciarse al pulsar un botón,
       * porque los navegadores pueden bloquear el autoplay.
       */
      async function iniciarMusica() {
        if (silenciado) return;

        try {
          await musica.play();
          controlAudio.textContent = "🔊";
        } catch (error) {
          controlAudio.textContent = "🔊";
        }
      }

      botones.forEach((boton) => {
        boton.addEventListener("click", () => {
          reproducirEfecto();
          iniciarMusica();

          const destino = boton.dataset.destino;

          if (destino) {
            window.location.href = destino;
          }
        });
      });

      controlAudio.addEventListener("click", async () => {
        silenciado = !silenciado;
        musica.muted = silenciado;

        if (silenciado) {
          controlAudio.textContent = "🔇";
        } else {
          controlAudio.textContent = "🔊";

          try {
            await musica.play();
          } catch (error) {
            // El navegador puede requerir otra interacción.
          }
        }
      });

      musica.addEventListener("error", () => {
        console.warn(
          "No se encontró la música. Revisa el nombre y la carpeta del archivo."
        );
      });
    })();
  </script>

</body>
</html>
