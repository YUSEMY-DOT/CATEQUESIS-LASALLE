<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#02091f">
  <title>Camino hacia Jesús - Colegio La Salle del Sur</title>
  <link rel="preload" as="image" href="./assets/PORTAL%20CATEQUESIS.png">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      position: relative;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #02091f;
    }

    /* PORTADA UBICADA A LA IZQUIERDA */
    .portada {
      position: fixed;
      z-index: 1;
      top: 0.7%;
      right: 17.5%;
      bottom: 0.7%;
      left: 0.5%;
      overflow: hidden;
      background-color: #02091f;
      background-image: url("./assets/PORTAL%20CATEQUESIS.png");
      background-position: center center;
      background-repeat: no-repeat;
      background-size: 100% 100%;
    }

    /* PANEL CONTENEDOR DE LOS BOTONES A LA DERECHA (ESTILO 3D ACORDE AL PORTAL) */
    .panel-menu {
      position: fixed;
      z-index: 5;
      top: 1.5%;
      bottom: 1.5%;
      right: 0.8%;
      width: 16%;
      max-width: 220px;
      min-width: 140px;
      background: linear-gradient(145deg, #102a5c 0%, #061a38 60%, #020d22 100%);
      border: 3px solid #d7b65d;
      border-radius: 14px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7), inset 0 0 20px rgba(215, 182, 93, 0.25);
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      align-items: center;
      padding: 12px 8px;
    }

    .menu {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      align-items: center;
      gap: 6px;
      margin: 0;
      padding: 0;
    }

    .menu-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      flex: 1;
      max-height: 18.5%;
      min-height: 0;
    }

    /* BOTONES 3D INTERACTIVOS */
    .boton {
      width: 72%;
      height: 70%;
      max-width: 115px;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      padding: 0;
      border: 2px solid #f5d477;
      border-radius: 10px;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.25), rgba(10, 35, 83, 0.8));
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.6);
      cursor: pointer;
      line-height: 0;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease, background 0.2s ease;
    }

    .boton img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      border: none;
      margin: 0;
      padding: 0;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.4));
    }

    .boton:hover {
      transform: translateY(-3px) scale(1.06);
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.4), rgba(20, 55, 120, 0.9));
      box-shadow: 0 8px 18px rgba(215, 182, 93, 0.4), inset 0 1px 3px rgba(255, 255, 255, 0.8);
    }

    .boton:active {
      transform: translateY(1px) scale(0.98);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.6), inset 0 2px 4px rgba(0, 0, 0, 0.4);
    }

    /* NOMBRE DE CADA BOTÓN DEBAJO */
    .nombre-opcion {
      margin-top: 3px;
      color: #f5d477;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(8px, 0.85vw, 12px);
      font-weight: 800;
      text-align: center;
      line-height: 1.1;
      text-shadow: 0 1px 2px #000, 0 0 5px rgba(245, 212, 119, 0.5);
      width: 100%;
      padding: 0 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* BOTÓN DE AUDIO */
    .control-audio {
      position: absolute;
      z-index: 10;
      top: 14px;
      left: 14px;
      width: 42px;
      height: 42px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      background: rgba(10, 35, 83, 0.8);
      border: 2px solid #d7b65d;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .control-audio:hover {
      transform: scale(1.1);
      background: rgba(20, 55, 120, 0.95);
    }

    /* DERECHOS RESERVADOS */
    .derechos-reservados {
      position: fixed;
      z-index: 8;
      left: 10%;
      width: 60%;
      bottom: 1.2%;
      margin: 0;
      padding: 0;
      color: #ffffff;
      background: transparent;
      border: none;
      font-size: clamp(12px, 1.05vw, 18px);
      font-weight: 800;
      line-height: 1.3;
      text-align: center;
      text-shadow:
        -1px -1px 2px #002d83,
         1px -1px 2px #002d83,
        -1px  1px 2px #002d83,
         1px  1px 2px #002d83,
         0 0 5px #002d83;
      pointer-events: none;
    }

    /* TABLET */
    @media (max-width: 900px) {
      .panel-menu {
        width: 19%;
      }
      .portada {
        right: 20.5%;
      }
      .control-audio {
        top: 9px;
        left: 9px;
        width: 36px;
        height: 36px;
        font-size: 17px;
      }
      .derechos-reservados {
        font-size: clamp(10px, 1.3vw, 14px);
      }
    }

    /* CELULAR */
    @media (max-width: 600px) {
      .panel-menu {
        width: 24%;
        padding: 6px 3px;
      }
      .portada {
        right: 25.5%;
      }
      .nombre-opcion {
        font-size: clamp(7px, 2vw, 9px);
      }
      .control-audio {
        top: 6px;
        left: 6px;
        width: 32px;
        height: 32px;
        font-size: 15px;
      }
      .derechos-reservados {
        left: 5%;
        width: 68%;
        font-size: clamp(8px, 2vw, 11px);
      }
    }
  </style>
</head>

<body>

  <!-- PANEL CONTENEDOR DE BOTONES A LA DERECHA -->
  <aside class="panel-menu" aria-label="Menú principal">
    <nav class="menu">

      <!-- 1. NUESTRA PROGRAMACIÓN -->
      <div class="menu-item">
        <button class="boton" type="button"
          data-destino="programacion.html"
          aria-label="Nuestra Programación">
          <img src="./assets/BTN-PROGRAMACION.png" alt="Nuestra Programación">
        </button>
        <span class="nombre-opcion">Programación</span>
      </div>

      <!-- 2. CATEQUIZANDOS -->
      <div class="menu-item">
        <button class="boton" type="button"
          data-destino="catequizandos.html"
          aria-label="Catequizandos">
          <img src="./assets/BTN-CATEQUIS.png" alt="Catequizandos">
        </button>
        <span class="nombre-opcion">Catequizandos</span>
      </div>

      <!-- 3. CATEQUISTAS -->
      <div class="menu-item">
        <button class="boton" type="button"
          data-destino="misses.html"
          aria-label="Catequistas">
          <img src="./assets/BTN_CATEQUISTAS.png" alt="Catequistas">
        </button>
        <span class="nombre-opcion">Catequistas</span>
      </div>

      <!-- 4. PADRES DE FAMILIA -->
      <div class="menu-item">
        <button class="boton" type="button"
          data-destino="padres.html"
          aria-label="Padres de familia">
          <img src="./assets/BTN-PADRES.png" alt="Padres de familia">
        </button>
        <span class="nombre-opcion">Padres</span>
      </div>

      <!-- 5. COORDINADOR PARROQUIAL -->
      <div class="menu-item">
        <button class="boton" type="button"
          data-destino="supervisores.html"
          aria-label="Coordinador Parroquial">
          <img src="./assets/BTN_COORDINADOR.png" alt="Coordinador Parroquial">
        </button>
        <span class="nombre-opcion">Coordinador</span>
      </div>

    </nav>
  </aside>

  <!-- PORTADA PRINCIPAL -->
  <main class="portada" aria-label="Camino hacia Jesús">

    <!-- MÚSICA -->
    <audio id="musica" loop preload="auto">
      <source
        src="./alma-misionera-athenas-musica-catolica.mp3"
        type="audio/mpeg">
    </audio>

    <!-- ÚNICO CONTROL DE AUDIO -->
    <button
      id="controlAudio"
      class="control-audio"
      type="button"
      aria-label="Reproducir música"
      title="Activar o silenciar música">🔊</button>

  </main>

  <!-- DERECHOS RESERVADOS -->
  <footer class="derechos-reservados">
    © Corporación La Salle del Sur. Derechos reservados.
  </footer>

  <script>
    (() => {
      "use strict";

      const musica = document.getElementById("musica");
      const controlAudio = document.getElementById("controlAudio");
      const botones = document.querySelectorAll(".boton");

      let silenciado = false;
      let contextoAudio = null;

      /* MÚSICA */
      async function iniciarMusica() {
        if (silenciado) return;

        try {
          musica.muted = false;
          musica.volume = 0.2;
          await musica.play();

          controlAudio.textContent = "🔊";
          controlAudio.setAttribute("aria-label", "Silenciar música");
          controlAudio.title = "Silenciar música";
        } catch (error) {
          controlAudio.textContent = "▶";
          controlAudio.setAttribute("aria-label", "Reproducir música");
          controlAudio.title = "Pulsa para reproducir la música";
        }
      }

      /* EFECTO SONORO AL PULSAR LOS BOTONES */
      function efectoBoton() {
        try {
          const AudioContext =
            window.AudioContext || window.webkitAudioContext;

          if (!AudioContext) return;

          if (!contextoAudio) {
            contextoAudio = new AudioContext();
          }

          const reproducir = () => {
            const ahora = contextoAudio.currentTime;
            const tono = contextoAudio.createOscillator();
            const volumen = contextoAudio.createGain();

            tono.type = "sine";
            tono.frequency.setValueAtTime(880, ahora);
            tono.frequency.exponentialRampToValueAtTime(
              660,
              ahora + 0.12
            );

            volumen.gain.setValueAtTime(0.0001, ahora);
            volumen.gain.linearRampToValueAtTime(
              0.07,
              ahora + 0.015
            );
            volumen.gain.exponentialRampToValueAtTime(
              0.0001,
              ahora + 0.16
            );

            tono.connect(volumen);
            volumen.connect(contextoAudio.destination);

            tono.start(ahora);
            tono.stop(ahora + 0.17);
          };

          if (contextoAudio.state === "suspended") {
            contextoAudio.resume().then(reproducir).catch(() => {});
          } else {
            reproducir();
          }
        } catch (error) {
          /* El sonido no debe impedir la navegación. */
        }
      }

      /* NAVEGACIÓN: UN SOLO TOQUE */
      botones.forEach((boton) => {
        boton.addEventListener("click", () => {
          efectoBoton();

          const destino = boton.getAttribute("data-destino");

          if (destino) {
            window.location.href = destino;
          }
        });
      });

      /* ACTIVAR O SILENCIAR LA MÚSICA */
      controlAudio.addEventListener("click", async () => {
        if (!silenciado) {
          silenciado = true;
          musica.muted = true;
          controlAudio.textContent = "🔇";
          controlAudio.setAttribute("aria-label", "Activar música");
          controlAudio.title = "Activar música";
        } else {
          silenciado = false;
          musica.muted = false;
          await iniciarMusica();
        }
      });

      musica.addEventListener("playing", () => {
        if (!silenciado) {
          controlAudio.textContent = "🔊";
          controlAudio.setAttribute("aria-label", "Silenciar música");
        }
      });

      musica.addEventListener("error", () => {
        controlAudio.textContent = "▶";
        controlAudio.setAttribute("aria-label", "Reproducir música");
      });

      /* INTENTAR REPRODUCIR LA MÚSICA CON INTERACCIÓN DE USUARIO O CARGA */
      window.addEventListener("load", () => {
        iniciarMusica();
      }, { once: true });

      // Permite iniciar música con cualquier clic en la página si el navegador bloquea el autoplay inicial
      document.body.addEventListener("click", () => {
        if (musica.paused && !silenciado) {
          iniciarMusica();
        }
      }, { once: true });

    })();
  </script>

</body>
</html>
