
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10275b">
  <title>Camino hacia Jesús - Colegio La Salle del Sur</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #10275b;
      background-image: url("./assets/PORTAL%20CATEQUESIS.png");
      background-position: center center;
      background-repeat: no-repeat;
      background-size: 100% 100%;
    }

    /* MENÚ: COLUMNA IZQUIERDA, BOTONES MÁS PEQUEÑOS */
    .menu {
      position: fixed;
      z-index: 5;
      top: 1.2%;
      left: 1.2%;
      width: 17%;
      max-width: 190px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 7px;
    }

    .boton {
      display: block;
      width: 100%;
      padding: 0;
      margin: 0;
      border: none;
      outline: none;
      background: transparent;
      box-shadow: none;
      cursor: pointer;
      line-height: 0;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s ease;
    }

    .boton:hover {
      transform: scale(1.015);
    }

    .boton:active {
      transform: scale(0.985);
    }

    .boton img {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      padding: 0;
      border: 0;
      object-fit: contain;
    }

    /* FRASE EN EL CIELO: AZUL SÓLIDO, SIN CONTORNO GRUESO */
    .frase-mision {
      position: fixed;
      z-index: 2;
      top: 2%;
      left: 24.5%;
      width: 31%;
      max-width: 500px;
      max-height: 115px;
      overflow: hidden;
      margin: 0;
      padding: 0;

      color: #003da5;
      -webkit-text-fill-color: #003da5;
      -webkit-text-stroke: 0;

      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(13px, 1.25vw, 20px);
      font-weight: 800;
      font-style: italic;
      line-height: 1.22;
      text-align: center;

      text-shadow:
        0 0 2px rgba(255, 255, 255, 0.95),
        1px 1px 1px rgba(255, 255, 255, 0.85);
    }

    /* BOTÓN ÚNICO PARA CONTROLAR LA MÚSICA */
    .control-audio {
      position: fixed;
      z-index: 10;
      right: 14px;
      bottom: 14px;
      width: 44px;
      height: 44px;
      padding: 0;

      display: flex;
      justify-content: center;
      align-items: center;

      color: white;
      background: rgba(10, 35, 83, 0.72);
      border: 1px solid #d7b65d;
      border-radius: 50%;
      font-size: 21px;
      cursor: pointer;
    }

    @media (max-width: 700px) {
      .menu {
        top: 1%;
        left: 1%;
        width: 24%;
        max-width: 145px;
        gap: 5px;
      }

      .frase-mision {
        top: 1.5%;
        left: 25%;
        width: 34%;
        max-width: 300px;
        max-height: 100px;
        font-size: clamp(10px, 2vw, 14px);
        line-height: 1.2;
      }

      .control-audio {
        right: 8px;
        bottom: 8px;
        width: 38px;
        height: 38px;
        font-size: 18px;
      }
    }

    @media (max-width: 420px) {
      .menu {
        width: 25%;
        max-width: 105px;
        gap: 4px;
      }

      .frase-mision {
        left: 27%;
        width: 35%;
        max-height: 85px;
        font-size: 10px;
      }
    }
  </style>
</head>

<body>

  <div class="frase-mision">
    Guiamos sus primeros pasos en la fe,
    acompañamos sus corazones hacia Jesús
    y sembramos en sus vidas el amor de Dios,
    para que cada sacramento sea el comienzo
    de una historia de fe que los acompañe
    por siempre.
  </div>

  <nav class="menu" aria-label="Menú principal">

    <button class="boton" type="button"
      data-destino="catequizandos.html"
      aria-label="Catequizandos">
      <img src="./assets/BTN-CATEQUIS.png"
        alt="Catequizandos">
    </button>

    <button class="boton" type="button"
      data-destino="misses.html"
      aria-label="Catequistas">
      <img src="./assets/BTN_CATEQUISTAS.png"
        alt="Catequistas">
    </button>

    <button class="boton" type="button"
      data-destino="supervisores.html"
      aria-label="Coordinador parroquial">
      <img src="./assets/BTN_COORDINADOR.png"
        alt="Coordinador parroquial">
    </button>

    <button class="boton" type="button"
      data-destino="padres.html"
      aria-label="Padres de familia">
      <img src="./assets/BTN-PADRES.png"
        alt="Padres de familia">
    </button>

    <button class="boton" type="button"
      data-destino="programacion.html"
      aria-label="Programación">
      <img src="./assets/BTN-PROGRAMACION.png"
        alt="Programación">
    </button>

  </nav>

  <audio id="musica" loop preload="auto">
    <source
      src="./assets/Alma%20Misionera%20Athenas%20-%20M%C3%BAsica%20Cat%C3%B3lica.mp3"
      type="audio/mpeg">
    <source
      src="./Alma%20Misionera%20Athenas%20-%20M%C3%BAsica%20Cat%C3%B3lica.mp3"
      type="audio/mpeg">
  </audio>

  <button
    id="controlAudio"
    class="control-audio"
    type="button"
    aria-label="Silenciar música"
    title="Activar o silenciar música">🔊</button>

  <script>
    (() => {
      "use strict";

      const musica = document.getElementById("musica");
      const controlAudio = document.getElementById("controlAudio");
      const botones = document.querySelectorAll(".boton");

      let silenciado = false;
      let contextoAudio = null;

      /* Efecto breve al pulsar los botones. */
      function efectoBoton() {
        try {
          const AudioContext =
            window.AudioContext || window.webkitAudioContext;

          if (!AudioContext) return;

          if (!contextoAudio) {
            contextoAudio = new AudioContext();
          }

          const reproducir = () => {
            const ahora = contextoAudio.currentTime;
            const tono = contextoAudio.createOscillator();
            const volumen = contextoAudio.createGain();

            tono.type = "sine";
            tono.frequency.setValueAtTime(880, ahora);
            tono.frequency.exponentialRampToValueAtTime(
              660, ahora + 0.12
            );

            volumen.gain.setValueAtTime(0.0001, ahora);
            volumen.gain.linearRampToValueAtTime(
              0.10, ahora + 0.015
            );
            volumen.gain.exponentialRampToValueAtTime(
              0.0001, ahora + 0.16
            );

            tono.connect(volumen);
            volumen.connect(contextoAudio.destination);
            tono.start(ahora);
            tono.stop(ahora + 0.17);
          };

          if (contextoAudio.state === "suspended") {
            contextoAudio.resume().then(reproducir).catch(() => {});
          } else {
            reproducir();
          }
        } catch (error) {
          console.warn("No se pudo reproducir el efecto de sonido.");
        }
      }

      /* Reproduce la música cuando el navegador lo permite. */
      async function iniciarMusica() {
        if (silenciado) return;

        try {
          await musica.play();
          controlAudio.textContent = "🔊";
          controlAudio.setAttribute("aria-label", "Silenciar música");
        } catch (error) {
          console.warn(
            "No se pudo reproducir la música. Comprueba el archivo MP3 y su ruta."
          );
        }
      }

      /* Intento inicial: puede ser bloqueado por el navegador. */
      window.addEventListener("load", () => {
        iniciarMusica();
      });

      /* Primer clic en cualquier parte de la portada. */
      document.addEventListener("pointerdown", () => {
        if (musica.paused && !silenciado) {
          iniciarMusica();
        }
      }, { once: true });

      botones.forEach((boton) => {
        boton.addEventListener("click", async (evento) => {
          evento.preventDefault();

          efectoBoton();

          if (!silenciado && musica.paused) {
            await iniciarMusica();
          }

          const destino = boton.getAttribute("data-destino");

          if (destino) {
            window.location.href = destino;
          }
        });
      });

      controlAudio.addEventListener("click", async (evento) => {
        evento.stopPropagation();

        silenciado = !silenciado;
        musica.muted = silenciado;

        if (silenciado) {
          controlAudio.textContent = "🔇";
          controlAudio.setAttribute("aria-label", "Activar música");
        } else {
          controlAudio.textContent = "🔊";
          controlAudio.setAttribute("aria-label", "Silenciar música");
          await iniciarMusica();
        }
      });

      musica.addEventListener("error", () => {
        console.error(
          "Error de audio: ninguna de las rutas del MP3 se pudo reproducir."
        );
      });
    })();
  </script>

</body>
</html>
