```html
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071d49">
<title>Camino hacia Jesús 2026</title>

<style>
*{box-sizing:border-box}

:root{
  --dorado:#e8b947;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
}

body{
  min-height:100vh;
  overflow-x:hidden;
  font-family:Georgia,"Times New Roman",serif;
  background:#071d49;
}

/* IMAGEN PRINCIPAL DE FONDO */
.fondo{
  position:fixed;
  inset:0;
  z-index:-2;
  background-image:url("./assets/PORTAL_CATEQUESIS.png");
  background-position:center center;
  background-repeat:no-repeat;
  background-size:contain;
  background-color:#071d49;
}

/* BOTONES A LA IZQUIERDA, SIN CUADRO DE TÍTULO */
.contenedor{
  position:relative;
  z-index:1;
  min-height:100vh;
  width:100%;
  padding:16px;
  display:flex;
  align-items:center;
}

.botones{
  width:clamp(105px,12.5vw,190px);
  display:flex;
  flex-direction:column;
  gap:12px;
  margin-left:clamp(0px,1vw,14px);
}

.boton{
  display:block;
  width:100%;
  overflow:hidden;
  border:2px solid var(--dorado);
  border-radius:13px;
  background:#071d49;
  box-shadow:0 3px 12px #0008;
  transition:transform .2s ease,box-shadow .2s ease;
  -webkit-tap-highlight-color:transparent;
}

.boton img{
  display:block;
  width:100%;
  height:auto;
}

.boton:hover{
  transform:scale(1.035);
  box-shadow:0 0 16px #f6d779aa;
}

.boton:focus-visible{
  outline:3px solid white;
  outline-offset:3px;
}

/* TABLETAS */
@media(max-width:800px){
  .contenedor{padding:10px}
  .botones{
    width:clamp(95px,18vw,145px);
    gap:9px;
  }
  .boton{border-radius:10px}
}

/* CELULARES */
@media(max-width:520px){
  .fondo{
    background-position:center center;
    background-size:auto 100%;
  }

  .contenedor{
    min-height:100svh;
    padding:8px;
    align-items:center;
  }

  .botones{
    width:clamp(86px,27vw,125px);
    gap:8px;
    margin-left:0;
  }

  .boton{
    border-width:1.5px;
    border-radius:8px;
  }
}

@media(prefers-reduced-motion:reduce){
  .boton{transition:none}
}
</style>
</head>

<body>
<div class="fondo" aria-hidden="true"></div>

<main class="contenedor">
  <nav class="botones" aria-label="Portales de catequesis">

    <a class="boton" href="./catequizandos.html"
       aria-label="Catequizandos">
      <img src="./assets/BTN-CATEQUIS.png" alt="Catequizandos">
    </a>

    <a class="boton" href="./misses.html"
       aria-label="Catequistas">
      <img src="./assets/BTN_CATEQUISTAS.png" alt="Catequistas">
    </a>

    <a class="boton" href="./supervisores.html"
       aria-label="Coordinador Parroquial">
      <img src="./assets/BTN_COORDINADOR.png" alt="Coordinador Parroquial">
    </a>

    <a class="boton" href="./padres.html"
       aria-label="Padres">
      <img src="./assets/BTN-PADRES.png" alt="Padres">
    </a>

    <a class="boton" href="./programacion.html"
       aria-label="Nuestra Programación">
      <img src="./assets/BTN-PROGRAMACION.png" alt="Nuestra Programación">
    </a>

  </nav>
</main>
</body>
</html>
```
