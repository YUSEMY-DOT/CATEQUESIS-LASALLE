<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071b38">
  <title>Portal de Padres | Camino hacia Jesús 2026</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width:100%; min-height:100%; margin:0; }
    body {
      min-height:100vh; min-height:100dvh; position:relative;
      display:flex; align-items:center; justify-content:center;
      overflow:hidden; background:#061a38;
      font-family:Arial, Helvetica, sans-serif;
    }
    .portada-padres {
      width:100%; height:100vh; height:100dvh;
      display:flex; align-items:center; justify-content:center;
      background:#061a38;
    }
    .portada-padres img {
      display:block; width:100%; height:100%;
      object-fit:contain; object-position:center;
    }
    .acciones {
      position:absolute; left:0; right:0;
      bottom:max(24px, env(safe-area-inset-bottom));
      display:flex; justify-content:center; align-items:center;
      gap:12px; padding:0 16px;
    }
    .accion {
      display:inline-flex; justify-content:center; align-items:center;
      min-height:48px; padding:12px 24px;
      border:2px solid #f2d477; border-radius:999px;
      color:#071b38; background:linear-gradient(135deg,#fff0b8,#f2d477);
      box-shadow:0 5px 18px rgba(0,0,0,.38);
      font-size:15px; font-weight:800; text-decoration:none; text-align:center;
    }
    .accion-volver {
      color:#fff; background:rgba(5,24,52,.88);
      border-color:rgba(255,255,255,.8);
    }
    .accion:focus-visible { outline:3px solid #fff; outline-offset:4px; }
    @media(max-width:600px) {
      .acciones { bottom:max(14px, env(safe-area-inset-bottom)); gap:8px; flex-wrap:wrap; }
      .accion { min-height:44px; padding:10px 17px; font-size:13px; }
    }
  </style>
</head>
<body>
  <main class="portada-padres" aria-label="Portada del Portal de Padres de Familia">
    <img src="./assets/portal%20padres.png" alt="Portal de Padres de Familia — Camino hacia Jesús 2026" fetchpriority="high">
  </main>
  <nav class="acciones" aria-label="Acciones del Portal de Padres">
    <a class="accion accion-volver" href="./index.html">Volver al inicio</a>
    <a class="accion" href="./padres.html">INGRESAR AL PORTAL</a>
  </nav>
</body>
</html>
