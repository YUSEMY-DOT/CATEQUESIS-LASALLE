<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#061a38">
  <title>Portal de Padres | Camino hacia Jesús 2026</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width:100%; height:100%; margin:0;
    }
    body {
      min-height:100vh; min-height:100dvh;
      display:flex; align-items:center; justify-content:center;
      overflow:hidden; background:#061a38;
      font-family:Arial, Helvetica, sans-serif;
    }
    .escenario {
      position:relative;
      width:min(100vw, 177.577vh);
      width:min(100vw, 177.577dvh);
      aspect-ratio:1671 / 941;
      flex:0 0 auto;
    }
    .escenario img {
      display:block; width:100%; height:100%;
      object-fit:contain;
    }
    /* Zona transparente sobre el botón INGRESAR que ya aparece en la imagen.
       La imagen original se conserva intacta; esta zona abre el acceso real. */
    .ingresar {
      position:absolute;
      left:75.8%; top:72.1%;
      width:19.0%; height:8.0%;
      display:block;
      border-radius:999px;
      text-decoration:none;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }
    .ingresar:focus-visible {
      outline:4px solid #fff;
      outline-offset:3px;
      box-shadow:0 0 0 7px rgba(5,35,105,.75);
    }
    .volver {
      position:fixed; left:12px; top:12px; z-index:5;
      padding:8px 13px; border:1px solid rgba(255,255,255,.8);
      border-radius:999px; color:#fff;
      background:rgba(5,24,52,.72);
      font-size:12px; font-weight:700;
      text-decoration:none;
    }
    @media(max-width:600px) {
      .volver { left:8px; top:8px; padding:7px 10px; font-size:11px; }
      .ingresar:focus-visible { outline-width:3px; }
    }
  </style>
</head>
<body>
  <a class="volver" href="./index.html">← Inicio</a>
  <main class="escenario" aria-label="Portada original del Portal de Padres">
    <img src="./assets/portal%20padres.png"
         alt="Portal de Padres de La Salle del Sur con el equipo institucional y el acceso de familias"
         fetchpriority="high">
    <a class="ingresar" href="./padres.html"
       aria-label="Ingresar al Portal de Padres"
       title="Ingresar al Portal de Padres"></a>
  </main>
</body>
</html>
