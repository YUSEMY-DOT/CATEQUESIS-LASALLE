
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Padres | Camino hacia Jesús 2026</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    body {
      background-color: #f8f9fa;
    }

    .portal-titulo {
      color: #198754;
      font-weight: 700;
    }

    .portal-card {
      border: none;
      border-radius: 12px;
    }

    @media (max-width: 576px) {
      .encabezado {
        align-items: flex-start !important;
        flex-direction: column;
        gap: 12px;
      }

      .portal-titulo {
        font-size: 1.35rem;
      }
    }
  </style>
</head>

<body class="bg-light">
  <main class="container py-4">

    <div class="encabezado d-flex justify-content-between align-items-center mb-4">
      <h3 class="portal-titulo mb-0">
        👨‍👩‍👧‍👦 Portal de Padres de Familia
      </h3>

      <a
        href="./index.html"
        class="btn btn-outline-secondary btn-sm"
      >
        ⬅️ Volver a Portada
      </a>
    </div>

    <div class="card portal-card p-4 shadow-sm">
      <h5>Seguimiento Familiar</h5>

      <p class="text-muted mb-0">
        Consulte la asistencia de su hijo, el estado de documentos requeridos
        y el registro de trámites/pagos de la parroquia.
      </p>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
