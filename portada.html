
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#02091f">
  <title>Camino hacia Jesús 2026</title>

  <style>
    * { box-sizing: border-box; }

    :root {
      --azul: #02091f;
      --dorado: #e8b947;
      --crema: #fff7e5;
    }

    html {
      background: var(--azul);
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--crema);
      background: radial-gradient(
        ellipse at top, #0a1d40 0%, #02091f 65%, #010515 100%
      );
    }

    .indicacion-ingreso {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 1000;
      color: #f5d477;
      font-size: 13px;
      font-weight: bold;
      text-shadow: 0 1px 3px #000;
      letter-spacing: .2px;
      pointer-events: none;
      animation: brilloSuave 2.5s ease-in-out infinite;
    }

    @keyframes brilloSuave {
      0%, 100% { opacity: .78; }
      50% { opacity: 1; }
    }

    .contenedor {
      width: min(1500px, 100%);
      margin: auto;
      padding: 24px;
    }

    .encabezado {
      text-align: center;
      padding: 30px 15px;
      border: 2px solid var(--dorado);
      border-radius: 20px;
      background: linear-gradient(135deg, #07132d, #010719);
      box-shadow: 0 0 20px #d9a82d22;
    }

    .cruz {
      color: #ffe29a;
      font-size: clamp(42px, 7vw, 76px);
      line-height: 1;
      text-shadow: 0 0 18px #ffcf55;
    }

    h1 {
      margin: 12px 0 8px;
      color: #ffe3a0;
      font-size: clamp(25px, 4vw, 48px);
      text-shadow: 0 2px 4px #000;
    }

    .subtitulo {
      margin: 0;
      font-size: clamp(14px, 2vw, 20px);
      line-height: 1.5;
    }

    .separador {
      width: 70%;
      max-width: 500px;
      height: 2px;
      margin: 22px auto 0;
      background: linear-gradient(
        90deg, transparent, var(--dorado), transparent
      );
    }

    .botones {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px;
      margin-top: 28px;
    }

    .boton {
      display: block;
      overflow: hidden;
      border: 3px solid var(--dorado);
      border-radius: 18px;
      background: #03091c;
      box-shadow: 0 8px 18px #0005;
      transition: transform .2s, box-shadow .2s;
      -webkit-tap-highlight-color: transparent;
    }

    .boton img {
      display: block;
      width: 100%;
      height: auto;
    }

    .boton:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 20px #f6d77955;
    }

    .boton:focus-visible {
      outline: 1px solid #fff;
      outline-offset: 3px;
    }

    footer {
      padding: 28px 10px 10px;
      text-align: center;
      color: #f3dca2;
      font-size: 14px;
      line-height: 1.6;
    }

    @media (max-width: 800px) {
      .contenedor { padding: 14px; }
      .botones {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 15px;
      }
    }

    @media (max-width: 440px) {
      .contenedor { padding: 10px; }
      .encabezado { padding: 22px 10px; }
      .botones { gap: 10px; }
      .boton {
        border-width: 2px;
        border-radius: 12px;
      }
      .indicacion-ingreso {
        top: 8px;
        left: 8px;
        font-size: 11px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
      }
      .indicacion-ingreso { animation: none; }
    }
  </style>
</head>

<body>
  <div class="indicacion-ingreso">☝ Haz clic para ingresar</div>

  <main class="contenedor">
    <header class="encabezado">
      <div class="cruz" aria-hidden="true">✝</div>
      <h1>CAMINO HACIA JESÚS 2026</h1>
      <p class="subtitulo">Programa de Catequesis – Primera Comunión</p>
      <p class="subtitulo">Colegio La Salle del Sur</p>
      <div class="separador"></div>
    </header>

    <nav class="botones" aria-label="Portales principales">
      <a class="boton" href="./catequizandos.html"
         aria-label="Entrar a Catequizandos">
        <img src="./assets/BTN-CATEQUIS.png"
             alt="Catequizandos" fetchpriority="high" decoding="async">
      </a>

      <a class="boton" href="./misses.html"
         aria-label="Entrar a Catequistas">
        <img src="./assets/BTN_CATEQUISTAS.png"
             alt="Catequistas" decoding="async">
      </a>

      <a class="boton" href="./supervisores.html"
         aria-label="Entrar a Coordinador Parroquial">
        <img src="./assets/BTN_COORDINADOR.png"
             alt="Coordinador Parroquial" decoding="async">
      </a>

      <a class="boton" href="./padres.html"
         aria-label="Entrar a Padres">
        <img src="./assets/BTN-PADRES.png"
             alt="Padres" loading="lazy" decoding="async">
      </a>

      <a class="boton" href="./programacion.html"
         aria-label="Ver Nuestra Programación">
        <img src="./assets/BTN-PROGRAMACION.png"
             alt="Nuestra Programación" loading="lazy" decoding="async">
      </a>
    </nav>

    <footer>
      CAMINO HACIA JESÚS 2026<br>
      Colegio La Salle del Sur · Programa de Primera Comunión
    </footer>
  </main>

  <script>
    (() => {
      let audioContext = null;

      function reproducirSonido() {
        try {
          const AudioContextClass =
            window.AudioContext || window.webkitAudioContext;

          if (!AudioContextClass) return;

          if (!audioContext) {
            audioContext = new AudioContextClass();
          }

          if (audioContext.state === "suspended") {
            audioContext.resume();
          }

          const ahora = audioContext.currentTime;
          const oscilador = audioContext.createOscillator();
          const volumen = audioContext.createGain();

          oscilador.type = "sine";
          oscilador.frequency.setValueAtTime(880, ahora);
          oscilador.frequency.exponentialRampToValueAtTime(
            587.33, ahora + 0.12
          );

          volumen.gain.setValueAtTime(0.0001, ahora);
          volumen.gain.exponentialRampToValueAtTime(0.12, ahora + 0.015);
          volumen.gain.exponentialRampToValueAtTime(0.0001, ahora + 0.18);

          oscilador.connect(volumen);
          volumen.connect(audioContext.destination);

          oscilador.start(ahora);
          oscilador.stop(ahora + 0.19);
        } catch (error) {
          // Si el navegador bloquea el sonido, el acceso sigue funcionando.
        }
      }

      document.querySelectorAll(".boton").forEach((boton) => {
        boton.addEventListener("click", reproducirSonido);
      });
    })();
  </script>
</body>
</html>
